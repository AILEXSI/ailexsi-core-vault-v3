[package]
name = "ailexsi-core-vault-v2"
version = "0.1.0"
description = "AILEXSI Core Vault V3 desktop shell"
authors = ["AILEXSI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[lib]
name = "ailexsi_core_vault_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
